[package]
name = "sqlhighland"
version = "0.4.0"
edition = "2021"
rust-version = "1.89"
description = "A native, cross-platform SQL client built with Rust + GPUI. Browse schemas, query with dictionary-backed completion, page through results, and export to CSV or Excel — powered by Oracle's official pure-Rust thin driver, no Oracle Client required."
authors = ["Srikanth Marepalli"]
repository = "https://github.com/srikkanthm/sqlhighland"
# Application crate: never published to crates.io.
publish = false

[dependencies]
# Official Oracle thin driver (pure Rust, no Instant Client). Beta — expect API churn.
# Pinned to the fork via [patch.crates-io] below (plain-TCP cancellation).
oracledb = "26.0.0-beta.4"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
# Stable ids for saved connections.
uuid = { version = "1", features = ["v4"] }
# Cross-platform secret storage for connection passwords: picks the native
# store per platform (macOS Keychain, Windows Credential Manager, Linux Secret
# Service). The `v1` default feature supplies the simple `Entry` API.
keyring = { version = "=4.2.0", default-features = false, features = ["v1"] }
# Zeroize secrets held in memory (connection passwords) on drop.
# `serde` keeps `Zeroizing<String>` round-trippable through the TOML files.
zeroize = { version = "1", features = ["serde"] }
# SQL formatter (https://github.com/shssoichiro/sqlformat-rs).
sqlformat = "=0.5.0"
# LSP types for the editor completion provider (gui-only).
lsp-types = { version = "=0.97.0", optional = true }
# GUI deps are optional so DB logic + tests build without the Metal toolchain.
# Registry pins: gpui-pre 0.3.4 (zed snapshot) + gpui-kit 0.6.1 (components).
# gpui-kit re-exports gpui; keep both pins on the same 0.3.x line.
gpui = { package = "gpui-pre", version = "=0.3.4", optional = true }
# `tree-sitter-sql` bundles the SQL grammar for editor highlighting.
# (Without a grammar feature the Editor falls back to plain text.)
gpui-kit = { version = "=0.6.1", optional = true, features = ["tree-sitter-sql"] }
gpui-kit-assets = { version = "=0.6.1", optional = true }
# Native .xlsx export (pure Rust, no native deps). Pinned like the rest.
# `constant_memory` streams worksheet writes (uncapped exports stay lean).
rust_xlsxwriter = { version = "=0.99.0", features = ["constant_memory"] }

[features]
default = []
# Build/run the desktop app with: cargo run --features gui
gui = ["dep:gpui", "dep:gpui-kit", "dep:gpui-kit-assets", "dep:lsp-types"]
# gui + the kit's test-support for the headless UI tests. Kept separate from
# `gui` so the GUI-free `core`/`msrv` targets never pull gpui-pre-linux (and
# its fontconfig/wgpu/oo7 tree) on Linux.
gui-test = ["gui", "gpui-kit/test-support"]

# Desktop packaging via cargo-packager (https://github.com/crabnebula-dev/cargo-packager).
#   cargo install cargo-packager --locked
#   cargo packager --release
# The app binary is gui-gated, hence the explicit feature in the build step.
[package.metadata.packager]
product-name = "SQLHighland"
identifier = "com.srikkanthm.sqlhighland"
category = "DeveloperTool"
before-packaging-command = "cargo build --release --features gui"
formats = ["app", "dmg"]
out-dir = "dist"
icons = ["assets/icon/icon.icns"]

[package.metadata.packager.macos]
minimum-system-version = "11.0"

# Plain-TCP query cancellation, added on top of upstream `main` in this fork.
# Pinned to an exact commit so builds are reproducible; bump the rev when the
# fork changes.
#
# Only flat TCP connections get a cancel handle (TLS/TCPS returns
# "not supported"), so callers must keep the existing client-side abandon as a
# fallback.
[patch.crates-io]
oracledb = { git = "https://github.com/srikkanthm/rust-oracledb", rev = "efb7baf601491d73742f00e5d7df52bbec55cfa5" }

[[bin]]
name = "sqlhighland"
path = "src/main.rs"
required-features = ["gui"]

[[test]]
name = "ui_picker"
path = "tests/ui_picker.rs"
required-features = ["gui-test"]

[[test]]
name = "menus"
path = "tests/menus.rs"
required-features = ["gui-test"]

# Headless UI tests: these import `sqlhighland::app` / `guitheme` and use the
# kit's test-support, so they need `gui-test`. Gating them (rather than a
# plain `gpui-kit` dev-dependency) keeps gpui-pre-linux out of the GUI-free
# core/MSRV target set.
[[test]]
name = "browser_tree"
path = "tests/browser_tree.rs"
required-features = ["gui-test"]

[[test]]
name = "themes"
path = "tests/themes.rs"
required-features = ["gui-test"]
