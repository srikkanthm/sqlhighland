[package]
name = "sqlhighland"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "A native, cross-platform SQL client built with Rust + GPUI."
repository = "https://github.com/srikkanthm/sqlhighland"
# Application crate: never published to crates.io.
publish = false

[dependencies]
# Official Oracle thin driver (pure Rust, no Instant Client). Beta — expect API churn.
oracledb = "26.0.0-beta.3"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
# Stable ids for saved connections.
uuid = { version = "1", features = ["v4"] }
# Cross-platform secret storage for connection passwords: picks the native
# store per platform (macOS Keychain, Windows Credential Manager, Linux Secret
# Service). The `v1` default feature supplies the simple `Entry` API.
keyring = { version = "=4.2.0", default-features = false, features = ["v1"] }
# Zeroize secrets held in memory (connection passwords) on drop.
# `serde` keeps `Zeroizing<String>` round-trippable through the TOML files.
zeroize = { version = "1", features = ["serde"] }
# SQL formatter (https://github.com/shssoichiro/sqlformat-rs).
sqlformat = "=0.5.0"
# LSP types for the editor completion provider (gui-only).
lsp-types = { version = "=0.97.0", optional = true }
# GUI deps are optional so DB logic + tests build without the Metal toolchain.
# Registry pins: gpui-pre 0.3.4 (zed snapshot) + gpui-kit 0.6.1 (components).
# gpui-kit re-exports gpui; keep both pins on the same 0.3.x line.
gpui = { package = "gpui-pre", version = "=0.3.4", optional = true }
# `tree-sitter-sql` bundles the SQL grammar for editor highlighting.
# (Without a grammar feature the Editor falls back to plain text.)
gpui-kit = { version = "=0.6.1", optional = true, features = ["tree-sitter-sql"] }
gpui-kit-assets = { version = "=0.6.1", optional = true }
# Native .xlsx export (pure Rust, no native deps). Pinned like the rest.
# `constant_memory` streams worksheet writes (uncapped exports stay lean).
rust_xlsxwriter = { version = "=0.99.0", features = ["constant_memory"] }

[features]
default = []
# Build/run the desktop app with: cargo run --features gui
gui = ["dep:gpui", "dep:gpui-kit", "dep:gpui-kit-assets", "dep:lsp-types"]

[[bin]]
name = "sqlhighland"
path = "src/main.rs"
required-features = ["gui"]

[dev-dependencies]
# Headless UI tests (dialogs, focus, scrolling). Merges features with the
# optional gui dep; only built for test targets.
gpui-kit = { version = "=0.6.1", features = ["test-support", "tree-sitter-sql"] }

[[test]]
name = "ui_picker"
path = "tests/ui_picker.rs"
required-features = ["gui"]

[[test]]
name = "menus"
path = "tests/menus.rs"
required-features = ["gui"]

# gui-gated tests: these import `sqlhighland::app` / `guitheme`, so without
# `required-features` a plain `cargo test`/`clippy --all-targets` fails to
# compile them.
[[test]]
name = "browser_tree"
path = "tests/browser_tree.rs"
required-features = ["gui"]

[[test]]
name = "themes"
path = "tests/themes.rs"
required-features = ["gui"]
