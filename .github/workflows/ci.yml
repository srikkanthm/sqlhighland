name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # `rustup show` installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup show
      - run: cargo fmt --all -- --check

  # GUI-free core: builds and tests without Xcode/Metal. This is the job that
  # catches regressions in the database, SQL, completion, and config layers.
  core:
    name: Core (no gui)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --lib

  # Guards the `rust-version` claim in Cargo.toml: the GUI-free core must keep
  # compiling on the declared MSRV. `+1.89.0` overrides rust-toolchain.toml.
  msrv:
    name: MSRV (1.89)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.89.0 --profile minimal
      - uses: Swatinem/rust-cache@v2
      - run: cargo +1.89.0 check --all-targets

  # Port feedback: gpui-pre ships a Linux backend (gpui-pre-linux), so a check
  # here catches port breakage without a manual port. Provisional — the apt set
  # and the kit's Linux support are unproven, so it is non-blocking until green.
  linux-gui:
    name: GUI (Linux check)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: System deps (GPUI Linux backend)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake clang pkg-config libssl-dev \
            libfontconfig1-dev libfreetype6-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-dev libx11-xcb-dev libxcb1-dev \
            libxcb-composite0-dev libxcb-damage0-dev libxcb-randr0-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxcb-present-dev libxcb-xkb-dev libvulkan-dev
      - name: Check
        run: cargo check --features gui

  # The portable core must build on Windows too. `oracledb` → rustls pulls
  # `aws-lc-sys`, whose build needs NASM on Windows. Provisional: non-blocking
  # until confirmed green.
  windows-core:
    name: Core (Windows check)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Install NASM (aws-lc-sys build dependency)
        run: choco install nasm -y --no-progress
      - name: Check
        shell: bash
        run: |
          export PATH="/c/Program Files/NASM:$PATH"
          cargo check --lib

  # macOS-only: the GPUI snapshot compiles Metal shaders from its build script,
  # so this needs the Metal toolchain. Blocking: clippy + headless UI tests are
  # the GUI regression gate. (The two flaky picker tests are `#[ignore]`d in
  # tests/ui_picker.rs; see docs/REVIEW.md.)
  gui:
    name: GUI (macOS)
    # macOS 15 arm64 (Apple Silicon). macos-14 is deprecated (retires 2026-11);
    # the -intel/-large labels would be x86_64.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Ensure Metal toolchain
        run: |
          if xcrun --sdk macosx metal --version >/dev/null 2>&1; then
            echo "Metal compiler already available"
            exit 0
          fi
          latest="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          echo "Selecting $latest"
          sudo xcode-select -s "$latest/Contents/Developer"
          sudo xcodebuild -downloadComponent MetalToolchain
          xcrun --sdk macosx metal --version
      - name: Clippy
        run: cargo clippy --features gui --all-targets -- -D warnings
      - name: Headless UI tests
        run: >
          cargo test --features gui
          --test menus --test browser_tree --test themes --test ui_picker

  # Informational: surfaces RustSec advisories in the dependency tree. Kept
  # non-blocking because transitive crates can report advisories we don't own.
  audit:
    name: Security audit
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
