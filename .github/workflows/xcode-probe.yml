name: Xcode probe
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: macos-15
    steps:
      - name: Probe Xcode / Metal toolchain
        run: |
          echo "xcode-select -p: $(xcode-select -p)"
          echo "which xcodebuild: $(which xcodebuild)"
          echo "DEVELOPER_DIR: ${DEVELOPER_DIR:-<unset>}"
          xcodebuild -version || true
          echo "--- /Applications Xcodes ---"
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          echo "--- -downloadComponent supported? ---"
          xcodebuild -help 2>&1 | grep -i downloadComponent || echo "NO -downloadComponent"
          echo "--- metal present? ---"
          xcrun --sdk macosx metal --version >/dev/null 2>&1 && echo "YES metal" || echo "NO metal"
          echo "--- newest xcode (16.x) ---"
          ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1 || true
